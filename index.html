 modal(`<div class="box"><h3>Bulk message</h3><textarea id="bm" class="ta" rows="3" placeholder="Write one message to send to many people"></textarea><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--m)" id="bcn">0 selected</small><button class="b" style="height:32px" onclick="bulkAll()">Select all</button></div><div style="max-height:32vh;overflow:auto">${us.map(u=>`<label class="sr" style="cursor:pointer"><span style="display:flex;gap:10px;align-items:center">${av(u)}${e(u.name)}</span><input type="checkbox" class="bk2" value="${u.i}" onchange="bulkCnt()"></label>`).join('')||'<p style="color:var(--m);font-size:14px">No contacts yet.</p>'}</div>${PA?`<button class="b d" onclick="pubBc($('#bm').value.trim())">${ic('mega',16)}Announce to ALL users instead</button>`:''}<div style="display:flex;gap:8px"><button class="b w" style="flex:1" onclick="sendBulk()">${ic('send',16)}Send to selected</button><button class="b" onclick="closeM()">Cancel</button></div><small style="color:var(--m)">Up to 100 people per send, once a minute.</small></div>`)}
const bulkCnt=()=>{$('#bcn').textContent=document.querySelectorAll('.bk2:checked').length+' selected'},bulkAll=()=>{const c=[...document.querySelectorAll('.bk2')],a=c.slice(0,100).every(x=>x.checked);c.forEach((x,i)=>x.checked=!a&&i<100);bulkCnt()};
async function sendBulk(){const t=$('#bm').value.trim(),ids=[...document.querySelectorAll('.bk2:checked')].map(x=>x.value);if(!t)return toast('Write a message first.');if(!ids.length)return toast('Select at least one person.');if(ids.length>100)return toast('Select 100 people or fewer.');if(Date.now()-BLT<60000)return toast('Please wait a minute between bulk sends.');
 const b=db.batch();ids.forEach(to=>{const c=cid(to);b.set(db.doc('chats/'+c),{members:[me.uid,to].sort(),last:t.slice(0,60),lastBy:me.uid,ts:TS(),['rd_'+me.uid]:Date.now()},{merge:true});b.set(db.collection('chats/'+c+'/messages').doc(),{from:me.uid,ts:TS(),read:false,text:t});b.update(db.doc('users/'+to),{contacts:AU(me.uid)})});
 try{await b.commit();BLT=Date.now();closeM();toast('Sent to '+ids.length+' people');vib(12)}catch(x){er(x)}}
/* ---------- 3D background ---------- */
(function(){const cv=$('#bg'),cx=cv.getContext('2d',{alpha:false}),D=Math.PI*2,NP=420,pts=[],stars=[],rings=[0,1,2].map(k=>({R:1.42+k*.2,t:.55+k*.85,v:(.32+k*.1)*(k%2?-1:1)}));
let w,h,dp,Q=1,fa=16,last=performance.now(),tx=0,ty=0,mx=0,mj=0,T=0,rot=0;
const rs=()=>{dp=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;cv.width=w*dp;cv.height=h*dp;cx.setTransform(dp,0,0,dp,0,0)};rs();addEventListener('resize',rs);
for(let i=0;i<NP;i++){const y=1-2*(i+.5)/NP,r=Math.sqrt(1-y*y),a=i*2.39996;pts.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()*D])}
for(let i=0;i<90;i++)stars.push([Math.random(),Math.random(),Math.random()*.8+.2,Math.random()*D]);
const sp=document.createElement('canvas');sp.width=sp.height=64;{const g=sp.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.2,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}
addEventListener('pointermove',x=>{tx=x.clientX/w-.5;ty=x.clientY/h-.5},{passive:true});
addEventListener('deviceorientation',x=>{if(x.gamma!=null){tx=Math.max(-.5,Math.min(.5,x.gamma/60));ty=Math.max(-.5,Math.min(.5,(x.beta-45)/80))}},{passive:true});
const ms=$('#mas'),lg=$('#login'),ap=$('#app'),pr=(x,y,z,ax,ay,S,X,Y)=>{let a=x*Math.cos(ay)+z*Math.sin(ay),c=-x*Math.sin(ay)+z*Math.cos(ay),b=y*Math.cos(ax)-c*Math.sin(ax);c=y*Math.sin(ax)+c*Math.cos(ax);const f=3/(3+c);return[X+a*S*f,Y+b*S*f,f]},
 dot=(x,y,r,a)=>{cx.globalAlpha=a;cx.drawImage(sp,x-r,y-r,r*2,r*2)};
function dr(now){requestAnimationFrame(dr);const dt=Math.min(now-last,50);last=now;fa+=(dt-fa)*.05;
 if(fa>21&&Q>.3)Q-=.004*dt/16;else if(fa<15&&Q<1)Q+=.002*dt/16;
 const k=1-Math.exp(-dt/220);mx+=(tx-mx)*k;mj+=(ty-mj)*k;
 if(!lg.classList.contains('hide'))ms.style.transform=`rotateY(${mx*36}deg) rotateX(${-mj*30}deg)`;
 cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.fillStyle='#000';cx.fillRect(0,0,w,h);
 if(PF.bg=='off'||PF.rm)return;
 const app=!ap.classList.contains('hide'),full=PF.bg=='full';T+=dt/1000;rot+=dt*(app?.00012:.0002);
 const A=app?(full?.5:.3):1,S=Math.min(w,h)*(app?.34:.3),X=w*(app?.78:.5)+mx*30,Y=h*(app?.5:.46)+mj*30,ay=rot+mx*1.1,ax=.42+Math.sin(T*.3)*.22+mj*.7,tw=Math.sin(T*.35)*.9,br=1+.04*Math.sin(T*1.1);
 cx.globalCompositeOperation='lighter';dot(X,Y,S*2.1,.07*A);
 const ns=(app?30:90)*Q|0;for(let i=0;i<ns;i++){const s=stars[i];dot((s[0]*w+T*6*s[2]-mx*40*s[2]+w*4)%w,(s[1]*h+T*2*s[2]-mj*30*s[2]+h*4)%h,1+s[2]*2,A*(.25+.2*Math.sin(T*1.5+s[3]))*.9)}
 const N=Math.max(40,(app?(full?260:100):NP)*Q|0),st=NP/N;
 for(let i=0;i<N;i++){const p=pts[i*st|0],c=Math.cos(tw*p[1]),s=Math.sin(tw*p[1]),q=pr((p[0]*c+p[2]*s)*br,p[1]*br,(-p[0]*s+p[2]*c)*br,ax,ay,S,X,Y);dot(q[0],q[1],(2.2+Math.sin(T*2+p[3])*.5)*q[2]*(S/220+.45),A*Math.min(1,Math.max(.06,(q[2]-.6)*1.25)))}
 for(let k2=0;k2<(app?1:3);k2++){const g=rings[k2],head=T*g.v*1.6,M=Math.max(30,60*Q|0),sg=Math.sign(g.v);for(let i=0;i<M;i++){const th=head-(i/M)*2.6*sg,q=pr(g.R*Math.cos(th),g.R*Math.sin(th)*Math.sin(g.t),g.R*Math.sin(th)*Math.cos(g.t),ax,ay,S,X,Y),f=1-i/M;dot(q[0],q[1],(1.5+f*5)*q[2],A*f*f*.95)}}
 cx.globalAlpha=1}
requestAnimationFrame(dr)})();
</script>
