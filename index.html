<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1M TeamSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#4285F4;--r:#EA4335;--y:#FBBC05;--g:#34A853;--bg:#000;--p:#0b0d12;--p2:#151922;--t:#eef1f6;--m:#8d96a8;--grad:linear-gradient(90deg,var(--b),var(--r),var(--y),var(--g))}
*{box-sizing:border-box;margin:0;font-family:Poppins,sans-serif}
body{background:var(--bg);color:var(--t);height:100vh;overflow:hidden}
.hide{display:none!important}
button{cursor:pointer;border:0;color:var(--t);background:var(--p2);border-radius:12px;padding:9px 14px;font-weight:500;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.2)}
button.pri{background:var(--b)}button.red{background:var(--r)}button.grn{background:var(--g)}
input,select{background:var(--p2);border:1px solid #2a3140;border-radius:12px;color:var(--t);padding:10px 12px;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 3px #4285f433}
#login{height:100vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
.blob{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(60px,-50px) scale(1.2)}}
.logo{font-size:56px;font-weight:700;background:var(--grad);background-size:300%;-webkit-background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:300%}}
.gbtn{background:#fff;color:#222;padding:14px 26px;font-size:15px;margin-top:26px;display:inline-flex;gap:12px;align-items:center;border-radius:40px;font-weight:600}
#app{display:flex;height:100vh}
aside{width:340px;background:var(--p);display:flex;flex-direction:column;border-right:1px solid #232a38}
.top{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid;border-image:var(--grad) 1}
.av{width:42px;height:42px;border-radius:50%;background:var(--b);display:grid;place-items:center;font-weight:600;flex:none;object-fit:cover}
.tabs{display:flex;gap:6px;padding:10px}.tabs button{flex:1}.tabs .on{background:var(--b)}
.add{display:flex;gap:6px;padding:0 10px 10px}.add input{flex:1}
#list{overflow:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;transition:.2s;border-left:4px solid transparent}
.row:hover,.row.on{background:var(--p2);border-left-color:var(--y)}

.empty{margin:auto;text-align:center;color:var(--m)}
.hd{padding:14px 18px;display:flex;align-items:center;gap:12px;background:var(--p);border-bottom:1px solid #232a38}
.hd b{flex:1}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:70%;padding:9px 14px;border-radius:16px;background:var(--p2);animation:pop .25s}
.m.me{align-self:flex-end;background:var(--b)}
.m small{display:block;font-size:10px;opacity:.6;text-align:right}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.send{display:flex;gap:8px;padding:12px;background:var(--p)}.send input{flex:1}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px;overflow:auto;flex:1}
.col{background:var(--p);border-radius:16px;padding:12px;border-top:4px solid}
.card{background:var(--p2);border-radius:12px;padding:12px;margin-top:10px;animation:pop .25s}
.card small{color:var(--m);display:block;margin:4px 0 8px}.card button{padding:5px 9px;font-size:12px;margin-right:4px}
.bar{display:flex;gap:8px;padding:12px 18px;flex-wrap:wrap;background:var(--p)}
#call,#ring{position:fixed;inset:0;background:#05070bf2;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#rv{width:min(92vw,900px);max-height:70vh;background:#000;border-radius:20px;border:2px solid var(--b)}
#lv{position:absolute;right:24px;top:24px;width:150px;border-radius:14px;border:2px solid var(--g);background:#000}
.pulse{width:96px;height:96px;font-size:36px;animation:pu 1.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 #34a85399}100%{box-shadow:0 0 0 40px #34a85300}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--r);padding:12px 20px;border-radius:12px;z-index:20}
@media(max-width:760px){aside{width:100%}main{display:none}#app.open aside{display:none}#app.open main{display:flex}.board{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

#bg{position:fixed;inset:0;z-index:0}#app{position:relative;z-index:1}
aside{background:#151922d9;backdrop-filter:blur(16px)}main{background:none}
.hd,.send,.bar{background:#151922d9;backdrop-filter:blur(12px)}.add{flex-wrap:wrap}
.mw{display:flex;flex-direction:column;align-items:flex-start;max-width:75%}.mw.me{align-self:flex-end;align-items:flex-end}
.mw .m{max-width:100%;word-break:break-word;position:relative}.m.dl{opacity:.55;font-style:italic}

body{background:#000}#login{display:flex;align-items:center;padding:0 8vw;text-align:left;background:none}
.hero{max-width:580px;position:relative;z-index:2}

aside{background:#07080cd9}.hd,.send,.bar{background:#07080ccc}

.m{background:#12151c;border:1px solid #ffffff14}.m.me{background:linear-gradient(135deg,var(--b),color-mix(in srgb,var(--b) 55%,#000));border-color:transparent}

button.pri{background:linear-gradient(135deg,var(--b),#1a5fd8)}button.grn{background:linear-gradient(135deg,#34A853,#1e7e34)}button.red{background:linear-gradient(135deg,#EA4335,#b3261e)}

#rail{width:68px;background:#05060a;border-right:1px solid #ffffff12;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;flex:none}

.tabs,.top{display:none!important}.bk{display:none}
.m{animation:none}.mw.new .m{animation:pop .25s}.card{animation:none}
#toast{background:#161a22;border:1px solid var(--b);box-shadow:0 8px 30px #000a}
.qt{border-left:3px solid var(--y);background:#0004;padding:4px 8px;border-radius:6px;margin-bottom:5px;font-size:12px;opacity:.85}.qt b{display:block}
.mi{max-width:240px;min-height:60px;border-radius:10px;display:block;cursor:zoom-in;margin-bottom:4px}.m audio{height:34px;max-width:220px}.m a{color:#9cc2ff}
.att{background:var(--p2);border-radius:12px;padding:9px 14px;cursor:pointer}#rep{padding:8px 14px;background:var(--p);border-left:3px solid var(--y);font-size:13px;color:var(--m)}
.ud{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);flex:none}.pn{opacity:.35;cursor:pointer;font-size:12px}.pn:hover,.pn.on{opacity:1}
.set{padding:20px;overflow:auto;display:grid;gap:16px;max-width:660px;width:100%;align-content:start}
.set section{background:#0b0d12cc;border:1px solid #ffffff12;border-radius:16px;padding:14px 18px}.set h3{margin-bottom:6px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:10px;border-bottom:1px solid #ffffff0a}.sr:last-child{border:0}
.tg input{display:none}.tg i{width:42px;height:24px;border-radius:12px;background:#2a3140;display:block;position:relative;cursor:pointer;transition:.2s}
.tg i::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg input:checked+i{background:var(--g)}.tg input:checked+i::after{left:21px}
.box.wide{width:min(94vw,440px)}.wicon,.wic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:#4285F4;flex:none}.wic{width:42px;height:42px;font-size:22px}
.pk{display:flex;flex-wrap:wrap;gap:6px}.pk span{font-size:22px;cursor:pointer;padding:4px;border-radius:8px}.pk span:hover{background:var(--p2)}
.pnl{padding:12px 18px;background:#0b0d12e6;max-height:42vh;overflow:auto}.mrow{display:flex;align-items:center;gap:10px;padding:6px 0}.mrow button{padding:4px 9px;font-size:12px}
.bdg{font-size:11px;border:1px solid #ffffff33;border-radius:20px;padding:1px 8px;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;padding:10px 18px 0;flex-wrap:wrap;font-size:13px;color:var(--m)}.pb{width:160px;height:8px;border-radius:8px;background:#1d222d;overflow:hidden}.pb i{display:block;height:100%;background:var(--grad);transition:width .5s}
body.cp .m{padding:4px 10px}body.cp .row{padding:8px 16px}body.rm *{animation:none!important}
@media(max-width:760px){#app{flex-direction:column-reverse}#rail{width:100%;flex-direction:row;padding:6px;justify-content:space-around}#rail button.on::before{display:none}#rail button{margin:0!important}aside{flex:1;min-height:0}.bk{display:inline-block}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="prof" class="hide modal"></div>
<div id="login"><div class="hero"><div id="lgbig"></div><h1 class="ttl" id="ttl">1M TeamSpace</h1>
<p class="tag">A new home for <b id="rot">conversations</b>, built for teams that ship.</p>
<div class="gw"><button class="gbtn" onclick="login()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Continue with Google</button></div>
<div class="chips"><span>💬 Realtime chat</span><span>🎥 HD video calls</span><span>✅ Task tracking</span><span>👥 Admin workspaces</span></div>
<p class="fine">Secure Google sign-in. Only registered members can be added.</p></div></div>

<div id="app" class="hide">
  <nav id="rail"><button id="r-c" class="on" onclick="setTab('c')" title="Chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button id="r-w" onclick="setTab('w')" title="Workspaces &amp; tasks"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5zM3 13l9 5 9-5"/></svg></button><button id="r-m" onclick="openMeet()" title="Meetings"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></svg></button><button id="r-s" onclick="openSettings()" title="Settings" style="margin-top:auto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button><button id="rav" onclick="openProfile()" title="Profile"></button></nav>
  <aside>
    <div class="brand"><span id="lgsm"></span><b>1M TeamSpace</b></div>
    <div class="top"><div class="av" id="meav"></div><b id="mename" style="flex:1"></b><button onclick="auth.signOut()">Sign out</button></div>
    <div class="tabs"><button id="t-c" class="on" onclick="setTab('c')">Chats</button><button id="t-w" onclick="setTab('w')">Workspaces</button></div>
    <div class="add" id="addbox"></div>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty"><div id="lgem" style="width:120px;margin:auto"></div><h2 style="margin-top:12px;color:var(--t)">1M TeamSpace</h2><p>Select a chat or workspace to begin</p></div></main>
</div>

<div id="ring" class="hide"><div class="av pulse" id="ringav"></div><h2 id="ringtxt"></h2>
  <div style="display:flex;gap:14px"><button class="grn" onclick="answer()">Accept</button><button class="red" onclick="declineCall()">Decline</button></div></div>
<div id="call" class="hide"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
  <div style="display:flex;gap:12px"><button onclick="tg('audio')">Mute</button><button onclick="tg('video')">Camera</button><button onclick="share()">Share screen</button><button class="red" onclick="endCall(true)">Hang up</button></div></div>
<div id="toast" class="hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 1) PASTE YOUR FIREBASE WEB CONFIG HERE (Project settings > Your apps > Web app)
firebase.initializeApp({apiKey:"AIzaSyBwk86OFNQNkt0iP-NgCrBPjoTlXHh5dUs",authDomain:"m-x-cb336.firebaseapp.com",databaseURL:"https://m-x-cb336-default-rtdb.firebaseio.com",projectId:"m-x-cb336",storageBucket:"m-x-cb336.firebasestorage.app",messagingSenderId:"506907140685",appId:"1:506907140685:web:81061cf49b83896e3a3204"});
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp,AU=firebase.firestore.FieldValue.arrayUnion;
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,my={},chats=[],wss=[],tab='c',cur=null,W=null,T=[],unM,unW,unT,UC={};
const toast=t=>{const x=$('#toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),3200)};
const login=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>toast(x.message));
const U=async id=>UC[id]||(UC[id]=(await db.doc('users/'+id).get()).data()||{name:'Unknown'});
const avt=(u,c='')=>u.photo?`<img class="av ${c}" src="${e(u.photo)}" referrerpolicy="no-referrer">`:`<div class="av ${c}">${e((u.name||'?')[0])}</div>`;
const cid=o=>[me.uid,o].sort().join('_');

auth.onAuthStateChanged(async u=>{
  if(!u){me=null;$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
  me=u;const us=await db.doc('users/'+u.uid).get();await db.doc('users/'+u.uid).set(us.exists?{email:u.email,emailLower:u.email.toLowerCase()}:{name:u.displayName,email:u.email,emailLower:u.email.toLowerCase(),photo:u.photoURL||''},{merge:true});
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  db.doc('users/'+u.uid).onSnapshot(s=>{my=s.data()||{};if(tab=='c')renderList()});
  db.collection('chats').where('members','array-contains',u.uid).onSnapshot(s=>{s.docChanges().forEach(c=>{const d=c.doc.data();if(c.type=='modified'&&d.lastBy&&d.lastBy!=u.uid&&document.hidden&&window.Notification&&Notification.permission=='granted')new Notification('New message',{body:d.last})});chats=s.docs.map(d=>d.data());if(tab=='c')renderList()},er);
  db.collection('workspaces').where('members','array-contains',u.uid).onSnapshot(s=>{wss=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=='w')renderList()});
  db.collection('calls').where('to','==',u.uid).where('state','==','ringing').onSnapshot(s=>s.docChanges().forEach(async c=>{
    if(c.type=='added'&&!pc){inc={id:c.doc.id,...c.doc.data()};const f=await U(inc.from);$('#ringav').outerHTML=avt(f,'pulse').replace('class="av','id="ringav" class="av');$('#ringtxt').textContent=f.name+' is '+(inc.video?'video':'audio')+' calling…';$('#ring').classList.remove('hide')}
    if(c.type=='removed'&&inc&&inc.id==c.doc.id&&!pc)$('#ring').classList.add('hide')}));
  setTab('c');
});

function setTab(t){tab=t;$('#t-c').classList.toggle('on',t=='c');$('#t-w').classList.toggle('on',t=='w');
  $('#addbox').innerHTML=t=='c'?'<input id="q" placeholder="Add by Google email"><button class="pri" onclick="addContact()">Add</button>':'<button class="pri" style="flex:1" onclick="newWs()">+ Create workspace</button>';renderList()}

async function renderList(){
  if(tab=='c'){const ids=[...new Set([...(my.contacts||[]),...chats.flatMap(c=>c.members).filter(x=>x!=me.uid)])];

 const h1=`<div class="prog"><div class="pb"><i style="width:${pc}%"></i></div><span>${pc}% done · ${dn}/${T.length}</span><span style="flex:1"></span><button class="${WF=='all'?'pri':''}" onclick="setWF('all')">All tasks</button><button class="${WF=='mine'?'pri':''}" onclick="setWF('mine')">My tasks</button></div>`,
 h2=cols.map(([k,n,c])=>`<div class="col" style="border-color:${c}" ondragover="event.preventDefault()" ondrop="dropT(event,'${k}')"><b>${n} (${tk.filter(t=>t.status==k).length})</b>${tk.filter(t=>t.status==k).map(card).join('')}</div>`).join('');
 if(h1+h2!==WH){WH=h1+h2;$('#wsp').innerHTML=h1;$('#wsb').innerHTML=h2}}
const setWF=v=>{WF=v;WH='';renderWs()},dropT=(ev,k)=>{ev.preventDefault();const id=ev.dataTransfer.getData('t');id&&setSt(id,k)};
function addTask(){const t=$('#tt').value.trim();if(!t)return toast('Enter a task title.');db.collection('workspaces/'+W.id+'/tasks').add({title:t,to:$('#ta').value,due:$('#td').value,pr:$('#tp').value,status:'todo',by:me.uid,ts:TS()}).catch(er);$('#tt').value=''}
async function addMember(){const x=$('#mm').value.trim().toLowerCase();if(!x)return;const q=await db.collection('users').where('emailLower','==',x).get();if(q.empty)return toast('That person has not signed up yet.');UC[q.docs[0].id]=q.docs[0].data();db.doc('workspaces/'+W.id).update({members:AU(q.docs[0].id)}).then(()=>toast('Member added')).catch(er)}
const setAdm=(i,on)=>db.doc('workspaces/'+W.id).update({admins:on?AU(i):AR(i)}).catch(er);
function rmMem(i){if(!confirm('Remove this member from the workspace?'))return;const o=(W.owner||W.admins[0])==me.uid;db.doc('workspaces/'+W.id).update(o?{members:AR(i),admins:AR(i)}:{members:AR(i)}).catch(er)}
function meetWs(){window.open(MEET,'_blank','noopener');W.members.filter(i=>i!=me.uid).forEach(i=>post(i,{text:'📹 Join the "'+W.name+'" meeting: '+MEET},'📹 Meeting invite'));toast('Meeting link sent to workspace members')}
async function delWs(){if(!confirm('Delete "'+W.name+'" and all its tasks permanently?'))return;const id=W.id;stop();try{const t=await db.collection('workspaces/'+id+'/tasks').get(),b=db.batch();t.docs.forEach(d=>b.delete(d.ref));await b.commit();await db.doc('workspaces/'+id).delete();W=null;$('#app').classList.remove('open');$('#main').innerHTML=emptyHtml();toast('Workspace deleted')}catch(x){er(x)}}
setTab('c');
</script>
</body>
</html>
